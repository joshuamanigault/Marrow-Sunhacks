[project]
name = "marrow"
version = "0.1.0"
description = "Marrow fossil CT workspace API"
requires-python = ">=3.13"
dependencies = [
    "fast-simplification>=0.2.0",
    "fastapi>=0.163.0",
    "google-genai>=3.3.0",
    "numpy>=2.5.4",
    "psycopg>=3.3.9",
    "pydantic-settings>=2.16.3",
    "trimesh[easy]>=5.2.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "standard"
