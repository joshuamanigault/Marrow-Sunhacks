<svg xmlns="http://www.w3.org/2000/svg" width="560" height="128" viewBox="0 0 560 128" role="img" aria-label="Marrow">
  <!-- Solid black badge + rim so it reads on dark and light README themes -->
  <rect x="2" y="2" width="556" height="124" rx="16" fill="#000000" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
  <!-- Brand mark from the app nav bone icon (Workspace Icon name="bone") -->
  <g transform="translate(8 16) scale(4)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.5 15.5l7-7" />
    <circle cx="6" cy="15" r="2.5" />
    <circle cx="9" cy="18" r="2.5" />
    <circle cx="15" cy="6" r="2.5" />
    <circle cx="18" cy="9" r="2.5" />
  </g>
  <text
    x="128"
    y="84"
    fill="#ffffff"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="64"
    font-weight="600"
    letter-spacing="-1.5"
  >Marrow</text>
</svg>
